# Copies the Beats by Say images out of Lovable into the repo and commits them to the branch it runs on.
# Runs when the script changes on a claude/ branch, or by hand. Needs no secrets.
name: fetch-assets
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/fetch-lovable-assets.mjs", ".github/workflows/fetch-assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-lovable-assets.mjs
        env:
          PREVIEW: https://id-preview--60bf9727-cfe5-47c6-9cd7-990394d45be4.lovable.app
          HOSTS: https://beats-by-say.lovable.app,https://beatsbysay.lovable.app,https://beatsbysay.com,https://www.beatsbysay.com
      - if: always()
        run: |
          git add src/assets public/favicon.png
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copy the Beats by Say images out of Lovable"
          git push
