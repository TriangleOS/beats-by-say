# On every push to main: database migrations and sign-in URLs (go-live pre), deploy the `beatsbysay` Cloudflare
# Worker, then Worker secrets and the custom domain when the DOMAIN variable is set (go-live post).
# Uses repository secrets; skips quietly until CLOUDFLARE_API_TOKEN exists. If the Worker is instead connected to
# this repo through Cloudflare Workers Builds (like Metarial), that does the same deploy; this workflow then only
# needs to run the go-live steps, and running both is harmless.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRIANGLE_LLM_URL: ${{ secrets.TRIANGLE_LLM_URL }}
      TRIANGLE_LLM_API_KEY: ${{ secrets.TRIANGLE_LLM_API_KEY }}
      DOMAIN: ${{ vars.DOMAIN }}
      SUPABASE_PROJECT_REF: kvpnvqmgxbqxfwqdrrmm
      WORKER: beatsbysay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
      - if: steps.token.outputs.present == 'true'
        run: npm ci && npm run build
      - if: steps.token.outputs.present == 'true'
        run: node scripts/go-live.mjs pre
      - if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy
      - if: steps.token.outputs.present == 'true'
        run: node scripts/go-live.mjs post
