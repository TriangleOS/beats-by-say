# On every push to main: sets up anything missing (database table, sign-in URLs, Pages project, Gemini key, domain when the DOMAIN variable is set)
# with scripts/go-live.mjs, then publishes the site to Cloudflare Pages.
# Uses repository secrets; skips quietly until CLOUDFLARE_API_TOKEN exists.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        run: npm ci && npm run build
      - if: steps.token.outputs.present == 'true'
        run: node scripts/go-live.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          SUPABASE_PROJECT_REF: kvpnvqmgxbqxfwqdrrmm
          PROJECT: beatsbysay
      - if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=beatsbysay --branch=main
